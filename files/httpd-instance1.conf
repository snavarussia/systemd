# Корневой каталог Apache. Здесь находятся конфигурационные файлы, модули и другие файлы Apache.
ServerRoot "/etc/httpd"
# Файл, в котором Apache сохраняет PID своего основного процесса.
# Для каждого экземпляра используется отдельный каталог, чтобы PID-файлы разных экземпляров не пересекались.
PidFile "/var/run/httpd-instance1/httpd.pid"
# Порт, на котором этот экземпляр Apache принимает HTTP-запросы.
Listen 8081
# Имя сервера.
ServerName localhost
# Подключаем необходимые модули Apache.
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
# LoadModule mime_module modules/mod_mime.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
# От имени какого пользователя и группы Apache будет работать после запуска инициализирующего процесса.
User apache
Group apache
# Корневой каталог сайта для этого экземпляра Apache.
DocumentRoot "/var/www/instance1"
# Настройки доступа к DocumentRoot.
<Directory "/var/www/instance1">
  # Не разрешать использование файлов .htaccess.
  # Все настройки задаются непосредственно в конфигурации Apache.
  AllowOverride None
  # Разрешить доступ к содержимому каталога всем клиентам.
  Require all granted
</Directory>
# Файл, который Apache будет искать при обращении к каталогу без указания конкретного имени файла.
# Например: http://localhost:8081/ -> Apache будет искать /var/www/instance1/index.html.
DirectoryIndex index.html
# Файл журнала ошибок этого экземпляра Apache. У каждого экземпляра свой лог.
ErrorLog "/var/log/httpd/instance1-error.log"
# Журнал обращений к серверу. Формат combined содержит IP, дату, HTTP-запрос, код ответа, размер ответа, Referer и User-Agent.
CustomLog "/var/log/httpd/instance1-access.log" combined
