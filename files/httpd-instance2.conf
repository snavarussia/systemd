# Корневой каталог Apache.
ServerRoot "/etc/httpd"
# PID-файл данного экземпляра Apache.
# Для instance2 используется отдельный каталог, чтобы PID не пересекался с другими экземплярами.
PidFile "/var/run/httpd-instance2/httpd.pid"
# Порт, на котором слушает instance2.
Listen 8082
# Имя сервера.
ServerName localhost
# Подключаем необходимые модули Apache.
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
# LoadModule mime_module modules/mod_mime.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
# Пользователь и группа, от имени которых Apache будет обрабатывать запросы.
User apache
Group apache
# Корневой каталог сайта instance2.
DocumentRoot "/var/www/instance2"
# Настройки доступа к каталогу сайта.
<Directory "/var/www/instance2">
  # Запрещаем использование .htaccess.
  # Все настройки задаются в основном конфигурационном файле.
  AllowOverride None
  # Разрешаем всем клиентам доступ к сайту.
  Require all granted
</Directory>
# Файл, который отдаётся по умолчанию при обращении к каталогу сайта.
DirectoryIndex index.html
# Журнал ошибок instance2.
ErrorLog "/var/log/httpd/instance2-error.log"
# Журнал всех обращений к instance2. Используется стандартный формат combined.
CustomLog "/var/log/httpd/instance2-access.log" combined
